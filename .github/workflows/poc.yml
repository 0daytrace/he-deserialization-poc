name: Run Crash PoC

on:
  workflow_dispatch:
  push:

jobs:
  run-poc:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build and Run PoC
        shell: bash
        run: |
          set +e
          echo "=== Starting swift run ==="
          # swift run will automatically build the project and then execute it.
          # We capture ALL output (both build logs and runtime crashes) into one file.
          swift run HE_PoC 2>&1 | tee full_output.log
          echo "=== Process exit status: $? ===" | tee -a full_output.log
        continue-on-error: true

      - name: Upload full output log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: he-poc-full-output
          path: full_output.log
          if-no-files-found: warn
